<!doctype html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator Ali mokh</title>

    <link rel="stylesheet" href="bootstrap.css" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light p-4">
    <div class="calculator card shadow p-3 mx-auto mt-5">
      <input
        type="text"
        id="screen"
        class="form-control mb-3 text-end fs-2"
        readonly
        placeholder="0"
      />

      <div class="row g-2 mb-2">
        <div class="col-6">
          <button class="btn btn-danger w-100" onclick="clearScreen()">
            C
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-secondary w-100" onclick="deleteChar()">
            delete
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-warning w-100" onclick="appendValue('/')">
            /
          </button>
        </div>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-3">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('7')">
            7
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('8')">
            8
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('9')">
            9
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-warning w-100" onclick="appendValue('*')">
            *
          </button>
        </div>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-3">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('4')">
            4
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('5')">
            5
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('6')">
            6
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-warning w-100" onclick="appendValue('-')">
            -
          </button>
        </div>
      </div>

      <div class="row g-2 mb-2">
        <div class="col-3">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('1')">
            1
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('2')">
            2
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('3')">
            3
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-warning w-100" onclick="appendValue('+')">
            +
          </button>
        </div>
      </div>

      <div class="row g-2">
        <div class="col-6">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('0')">
            0
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-dark w-100" onclick="appendValue('.')">
            .
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-success w-100" onclick="calculate()">=</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
