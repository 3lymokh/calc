<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator</title>
    <link rel="stylesheet" href="bootstrap.css" />
  </head>
  <body class="bg-primary p-5">
    <div
      class="calculator card border-3 border-dark p-3 mx-auto"
      style="max-width: 280px"
    >
      <input
        type="text"
        id="screen"
        class="form-control mb-3 text-end fs-3 border-2 border-dark"
      />

      <div class="row g-1 mb-1">
        <div class="col-3">
          <button class="btn btn-danger w-100 p-2" onclick="clearScreen()">
            C
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-warning w-100 p-2" onclick="deleteChar()">
            D
          </button>
        </div>
        <div class="col-3"></div>
        <div class="col-3">
          <button class="btn btn-dark w-100 p-2" onclick="appendValue('/')">
            /
          </button>
        </div>
      </div>

      <div class="row g-1 mb-1">
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('7')"
          >
            7
          </button>
        </div>
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('8')"
          >
            8
          </button>
        </div>
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('9')"
          >
            9
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 p-2" onclick="appendValue('*')">
            *
          </button>
        </div>
      </div>

      <div class="row g-1 mb-1">
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('4')"
          >
            4
          </button>
        </div>
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('5')"
          >
            5
          </button>
        </div>
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('6')"
          >
            6
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 p-2" onclick="appendValue('-')">
            -
          </button>
        </div>
      </div>

      <div class="row g-1 mb-1">
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('1')"
          >
            1
          </button>
        </div>
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('2')"
          >
            2
          </button>
        </div>
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('3')"
          >
            3
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-dark w-100 p-2" onclick="appendValue('+')">
            +
          </button>
        </div>
      </div>

      <div class="row g-1">
        <div class="col-3"></div>
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('0')"
          >
            0
          </button>
        </div>
        <div class="col-3">
          <button
            class="btn btn-secondary w-100 p-2"
            onclick="appendValue('.')"
          >
            .
          </button>
        </div>
        <div class="col-3">
          <button class="btn btn-success w-100 p-2" onclick="calculate()">
            =
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
